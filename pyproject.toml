[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lingity"
version = "0.1.0"
description = "Deterministic governed text analysis"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "phrocker" }]
# PEP 639 SPDX expression rather than the legacy free-text field, which is
# deprecated and which PyPI no longer renders. This form needs setuptools>=77,
# which the build-system requirement above pins. It also forbids a
# `License :: ...` classifier: declaring both is an error, not a duplication,
# so the classifier list below deliberately carries none.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["linguistics", "readability", "governance", "nlp", "deterministic"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]

# en_core_web_sm is deliberately absent. It is not on PyPI, so the only way to
# declare it here is a PEP 440 direct reference, and a public index rejects any
# distribution whose metadata carries one ("Can't have direct dependency").
# `twine check` does not catch this -- it validates only README rendering -- so
# the failure would surface for the first time at upload.
#
# Nothing is lost by omitting it. The pin that matters is enforced in code:
# lingity/nlp.py:load_pipeline refuses any version other than MODEL_VERSION and
# names the exact wheel to install, so a wrong model fails closed at analysis
# time rather than being silently tolerated. Installing it is a documented step
# in the READMEs and its own CI step.
dependencies = [
  "jsonschema>=4.23,<5",
  "markdown-it-py>=3,<4",
  "nltk>=3.9,<4",
  "spacy>=3.8,<3.9",
]

[project.urls]
Homepage = "https://github.com/phrocker/lingitylingity"
Repository = "https://github.com/phrocker/lingitylingity"
Issues = "https://github.com/phrocker/lingitylingity/issues"

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  # The canonical Trove classifier list, used by tests/test_documentation.py to
  # answer locally a question PyPI otherwise answers only at upload.
  "trove-classifiers>=2024.10.0",
  "types-jsonschema>=4.23,<5",
]
# Publishing only. Kept out of `dev` so a contributor does not install an upload
# tool to run the tests, and so CI does not carry it.
release = [
  "build>=1.2,<2",
  "twine>=5,<7",
  "trove-classifiers>=2024.10.0",
]

[project.scripts]
lingity = "lingity.cli:main"

[tool.setuptools.packages.find]
include = ["lingity*"]

[tool.setuptools.package-data]
lingity = ["py.typed", "profiles/*.json", "schemas/v1/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["lingity", "tests", "scripts"]
# `scripts` is not a package and is imported by tests through a sys.path insert,
# so mypy needs the same search path to resolve it. It is checked rather than
# excluded because it performs the one action in this repository that cannot be
# undone.
mypy_path = "scripts"

# numpy arrives transitively through spaCy. On Python 3.12+ pip resolves a numpy
# whose bundled stubs use PEP 695 `type` statements, which mypy refuses to parse
# while targeting 3.11:
#
#   numpy/__init__.pyi: error: Type statement is only supported in Python 3.12
#   and greater  [syntax]
#
# That aborts the run before any project code is checked. Skipping the module
# keeps python_version at 3.11 -- the oldest interpreter this package claims to
# support -- so project code is still checked against that target rather than
# against the newest interpreter that happens to be installed.
#
# The cost: numpy's own types degrade to Any. Nothing here imports numpy
# directly, so no project code loses checking today; that stops being true the
# moment something does.
#
# Both settings are required. `follow_imports` does not apply to stub files on
# its own; `follow_imports_for_stubs` is what extends it to the .pyi.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
